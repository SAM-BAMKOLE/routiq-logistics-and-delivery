name: ldms

# Optional local backing services. The API and web run on the host via pnpm.
# Postgres is a hosted Neon database (see api/.env.example); only the services
# below are meant to run in Docker, and only when you need them.
#   docker compose up -d
services:
  # Queue backing store for the deferred BullMQ worker.
  redis:
    image: redis:7-alpine
    container_name: ldms-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional: catches outbound email locally so nothing is sent to Gmail.
  # Web UI on http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: ldms-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  redis-data:
