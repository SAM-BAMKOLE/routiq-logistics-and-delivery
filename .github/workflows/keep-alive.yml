name: Keep Render App Alive

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -f -s -o /dev/null https://routiq-logistics-and-delivery.onrender.com/health/live || exit 1
